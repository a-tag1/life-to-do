<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>LifeToDo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6c63ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeToDo">
  <link rel="apple-touch-icon" href="icons/icon.svg">
</head>
<body>
<div id="app">

  <!-- ========== ヘッダー ========== -->
  <header id="app-header">
    <button id="btn-prev" class="nav-btn" aria-label="前へ">‹</button>
    <h1 id="header-title">読み込み中...</h1>
    <button id="btn-next" class="nav-btn" aria-label="次へ">›</button>
  </header>

  <!-- ========== メインコンテンツ ========== -->
  <main id="main-content">

    <!-- [1] 今日ビュー -->
    <section id="view-today" class="view">
      <div class="view-content">

        <div class="schedule-section">
          <div class="section-header">
            <span class="section-label">📋 予定</span>
            <div class="input-actions">
              <button class="btn-now" data-target="plan-textarea">今</button>
              <button class="btn-template" data-target="plan-textarea">テンプレ</button>
            </div>
          </div>
          <textarea
            id="plan-textarea"
            class="schedule-textarea"
            placeholder="予定を自由に入力&#10;例）読書：10:00-10:30&#10;　　ピアノ：～11:00"
          ></textarea>
        </div>

        <div class="schedule-section">
          <div class="section-header">
            <span class="section-label">✅ 実績</span>
            <div class="input-actions">
              <button class="btn-now" data-target="actual-textarea">今</button>
              <button class="btn-template" data-target="actual-textarea">テンプレ</button>
            </div>
          </div>
          <textarea
            id="actual-textarea"
            class="schedule-textarea"
            placeholder="実績を自由に入力&#10;例）読書：10:00～10:20&#10;　　ピアノ：～10:30"
          ></textarea>
        </div>

        <div class="habit-link-section">
          <button id="btn-habit-app" class="btn-habit">🔗 習慣アプリを開く</button>
        </div>

      </div>
    </section>

    <!-- [2] 今月ビュー -->
    <section id="view-monthly" class="view">
      <div id="monthly-days" class="view-content"></div>
    </section>

    <!-- [3] 年間ビュー -->
    <section id="view-yearly" class="view">
      <div id="yearly-months" class="view-content"></div>
    </section>

    <!-- [4] ビジョンビュー -->
    <section id="view-vision" class="view">
      <div class="view-content">

        <div class="vision-section">
          <div class="section-title">🌟 ビジョン・なりたい姿</div>
          <textarea
            id="vision-textarea"
            class="vision-textarea"
            placeholder="やりたいこと、なりたい姿を自由に書いてください&#10;&#10;例）毎朝30分読書する習慣を身につける&#10;　　マラソン完走する"
          ></textarea>
        </div>

        <div class="tasks-section">
          <div class="tasks-header">
            <div class="section-title" style="margin-bottom:0">🎯 具体的な行動・タスク</div>
            <button id="btn-add-task" class="btn-add">＋ 追加</button>
          </div>
          <div id="task-list"></div>
        </div>

      </div>
    </section>

    <!-- [5] 設定ビュー -->
    <section id="view-settings" class="view">
      <div class="view-content">

        <div class="settings-section">
          <div class="section-title">📝 テンプレート管理</div>
          <div id="template-list"></div>
          <div class="template-add-form">
            <input id="template-label-input" type="text" placeholder="表示名（例: 読書）">
            <input id="template-text-input" type="text" placeholder="挿入テキスト（例: 読書：）">
            <button id="btn-add-template" class="btn-primary">追加</button>
          </div>
        </div>

        <div class="settings-section">
          <div class="section-title">🔗 習慣アプリ連携</div>
          <div class="settings-row">
            <label for="habit-url-input">習慣アプリのURL</label>
            <input id="habit-url-input" type="url" placeholder="https://...">
          </div>
          <button id="btn-save-habit-url" class="btn-primary">保存</button>
        </div>

        <div class="settings-section">
          <div class="section-title">🎨 表示設定</div>
          <div class="settings-row">
            <label for="dark-mode-select">ダークモード</label>
            <select id="dark-mode-select">
              <option value="system">自動（OS設定連動）</option>
              <option value="dark">ダーク</option>
              <option value="light">ライト</option>
            </select>
          </div>
        </div>

        <div class="settings-section">
          <div class="section-title">💾 バックアップ・エクスポート</div>
          <button id="btn-export-txt" class="btn-secondary">📄 テキスト出力（.txt）</button>
          <button id="btn-export-csv" class="btn-secondary">📊 CSV出力（.csv）</button>
          <button id="btn-share" class="btn-secondary">📤 共有（Web Share）</button>
          <button id="btn-google-drive" class="btn-secondary">☁️ Google Drive連携</button>
          <div id="storage-status" class="storage-status"></div>
        </div>

      </div>
    </section>

  </main>

  <!-- ========== ボトムナビ ========== -->
  <nav id="bottom-nav" aria-label="メインナビゲーション">
    <button class="nav-item active" data-view="today">
      <span class="nav-icon">📅</span>
      <span>今日</span>
    </button>
    <button class="nav-item" data-view="monthly">
      <span class="nav-icon">📆</span>
      <span>今月</span>
    </button>
    <button class="nav-item" data-view="yearly">
      <span class="nav-icon">🗓</span>
      <span>年間</span>
    </button>
    <button class="nav-item" data-view="vision">
      <span class="nav-icon">🌟</span>
      <span>ビジョン</span>
    </button>
    <button class="nav-item" data-view="settings">
      <span class="nav-icon">⚙️</span>
      <span>設定</span>
    </button>
  </nav>

  <!-- ========== FAB: 今日に戻る ========== -->
  <button id="fab-today" class="fab hidden" aria-label="今日に戻る">今日<br>へ</button>

  <!-- ========== テンプレートモーダル ========== -->
  <div id="template-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="テンプレート選択">
    <div id="template-modal-overlay" class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>テンプレート挿入</h3>
        <button id="modal-close" class="btn-close" aria-label="閉じる">×</button>
      </div>
      <div id="modal-template-list" class="modal-list"></div>
    </div>
  </div>

</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
