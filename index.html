<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>LifeToDo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6c63ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeToDo">
  <link rel="apple-touch-icon" href="icons/icon.svg">
</head>
<body>
<div id="app">

  <!-- ========== ヘッダー ========== -->
  <header id="app-header">
    <button id="btn-prev" class="nav-btn" aria-label="前へ">‹</button>
    <h1 id="header-title">読み込み中...</h1>
    <button id="btn-next" class="nav-btn" aria-label="次へ">›</button>
  </header>

  <!-- ========== メインコンテンツ ========== -->
  <main id="main-content">

    <!-- [1] 今日ビュー -->
    <section id="view-today" class="view">
      <div class="view-content">

        <div class="schedule-section plan-section collapsed">
          <div class="section-header plan-toggle">
            <span class="section-label">予定 <span class="chevron">›</span></span>
            <div class="input-actions">
              <button class="btn-now" data-target="plan-textarea">今</button>
              <button class="btn-template" data-target="plan-textarea">テンプレ</button>
            </div>
          </div>
          <textarea
            id="plan-textarea"
            class="schedule-textarea"
            placeholder="予定を自由に入力&#10;例）読書：10:00-10:30&#10;　　ピアノ：～11:00"
          ></textarea>
        </div>

        <div class="schedule-section">
          <div class="section-header">
            <span class="section-label">実績</span>
            <div class="input-actions">
              <button id="btn-copy-plan" class="btn-copy">予定をコピー</button>
              <button class="btn-now" data-target="actual-textarea">今</button>
              <button class="btn-template" data-target="actual-textarea">テンプレ</button>
            </div>
          </div>
          <textarea
            id="actual-textarea"
            class="schedule-textarea"
            placeholder="実績を自由に入力&#10;例）読書：10:00～10:20&#10;　　ピアノ：～10:30"
          ></textarea>
        </div>

        <div class="habit-link-section">
          <button id="btn-habit-app" class="btn-habit">習慣アプリを開く</button>
        </div>

      </div>
    </section>

    <!-- [2] 今月ビュー -->
    <section id="view-monthly" class="view">
      <div id="monthly-days" class="view-content"></div>
    </section>

    <!-- [3] 年間ビュー -->
    <section id="view-yearly" class="view">
      <div id="yearly-months" class="view-content"></div>
    </section>

    <!-- [4] ビジョンビュー（ダッシュボード） -->
    <section id="view-vision" class="view">
      <div id="goal-list" class="view-content goal-list-content">
        <!-- Goal cards rendered by JS -->
      </div>
    </section>

    <!-- [4b] 理想像詳細ビュー (Goal Detail) -->
    <section id="view-goal-detail" class="view">
      <div class="view-content">
        <div class="goal-detail-title-card">
          <input
            id="goal-title-textarea"
            class="goal-title-edit-input"
            placeholder="理想像の名称を入力..."
            maxlength="60"
          >
        </div>
        <div class="goal-detail-note-card">
          <div class="section-title">モチベーション</div>
          <textarea
            id="goal-note-textarea"
            class="goal-note-textarea"
            placeholder="なぜこの目標を達成したいのか、どんな自分になりたいのかを書いてください..."
            rows="3"
          ></textarea>
        </div>
        <div id="project-list"></div>
        <button id="btn-add-project" class="btn-add-project">＋ やりたいことを追加</button>
      </div>
    </section>

    <!-- [5] タスクビュー -->
    <section id="view-tasks" class="view">
      <div class="view-content">
        <div class="tasks-section">
          <div class="tasks-header">
            <div class="section-title" style="margin-bottom:0">タスク（全プロジェクト・日付順）</div>
          </div>
          <div id="task-list"></div>
        </div>
      </div>
    </section>

    <!-- [6] 設定ビュー -->
    <section id="view-settings" class="view">
      <div class="view-content">

        <div class="settings-section">
          <div class="section-title">テンプレート</div>
          <div id="template-list"></div>
          <div class="template-add-form">
            <input id="template-label-input" type="text" placeholder="表示名（例: 読書）">
            <textarea id="template-text-input" class="template-text-input" rows="3" placeholder="挿入テキスト（例: 読書：&#10;例: Cmd+Enterで追加）"></textarea>
            <button id="btn-add-template" class="btn-primary">追加</button>
          </div>
        </div>

        <div class="settings-section">
          <div class="section-title">習慣アプリ連携</div>
          <div class="settings-row">
            <label for="habit-url-input">習慣アプリのURL</label>
            <input id="habit-url-input" type="url" placeholder="https://...">
          </div>
          <button id="btn-save-habit-url" class="btn-primary">保存</button>
        </div>

        <div class="settings-section">
          <div class="section-title">表示設定</div>
          <div class="settings-row">
            <label for="dark-mode-select">ダークモード</label>
            <select id="dark-mode-select">
              <option value="system">自動（OS設定連動）</option>
              <option value="dark">ダーク</option>
              <option value="light">ライト</option>
            </select>
          </div>
        </div>

        <div class="settings-section">
          <div class="section-title">バックアップ・エクスポート</div>
          <button id="btn-export-txt" class="btn-secondary">テキスト出力（.txt）</button>
          <button id="btn-export-csv" class="btn-secondary">CSV出力（.csv）</button>
          <button id="btn-share" class="btn-secondary">共有（Web Share）</button>
          <button id="btn-google-drive" class="btn-secondary">Google Drive連携</button>
          <div id="storage-status" class="storage-status"></div>
        </div>

        <div class="app-version">
          <span>LifeToDo</span>
          <span><span id="version-number">v1.1.0</span> &nbsp;·&nbsp; <span id="version-date">2026/9/4</span></span>
        </div>

      </div>
    </section>

  </main>

  <!-- ========== ボトムナビ ========== -->
  <nav id="bottom-nav" aria-label="メインナビゲーション">
    <button class="nav-item active" data-view="today">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        <circle cx="12" cy="16" r="1.5" fill="currentColor" stroke="none"/>
      </svg>
      <span>今日</span>
    </button>
    <button class="nav-item" data-view="monthly">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="15" x2="16" y2="15"/><line x1="8" y1="19" x2="13" y2="19"/>
      </svg>
      <span>今月</span>
    </button>
    <button class="nav-item" data-view="yearly">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <circle cx="3" cy="6" r="0.5" fill="currentColor" stroke="currentColor"/>
        <circle cx="3" cy="12" r="0.5" fill="currentColor" stroke="currentColor"/>
        <circle cx="3" cy="18" r="0.5" fill="currentColor" stroke="currentColor"/>
      </svg>
      <span>年間</span>
    </button>
    <button class="nav-item" data-view="vision">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
      </svg>
      <span>ビジョン</span>
    </button>
    <button class="nav-item" data-view="tasks">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/>
        <line x1="9" y1="18" x2="20" y2="18"/>
        <polyline points="3 6 4 7 6 5"/><polyline points="3 12 4 13 6 11"/>
        <polyline points="3 18 4 19 6 17"/>
      </svg>
      <span>タスク</span>
    </button>
    <button class="nav-item" data-view="settings">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
      <span>設定</span>
    </button>
  </nav>

  <!-- ========== FAB: 今日に戻る ========== -->
  <button id="fab-today" class="fab hidden" aria-label="今日に戻る">今日<br>へ</button>

  <!-- ========== FAB: 理想像追加 ========== -->
  <button id="fab-vision" class="fab fab-vision hidden" aria-label="理想像を追加">＋</button>

  <!-- ========== テンプレートモーダル ========== -->
  <div id="template-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="テンプレート選択">
    <div id="template-modal-overlay" class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>テンプレート挿入</h3>
        <button id="modal-close" class="btn-close" aria-label="閉じる">×</button>
      </div>
      <div id="modal-template-list" class="modal-list"></div>
    </div>
  </div>

  <!-- ========== 理想像追加モーダル ========== -->
  <div id="goal-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="goal-modal-title">
    <div id="goal-modal-overlay" class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="goal-modal-title">理想像を追加</h3>
        <button id="goal-modal-close" class="btn-close" aria-label="閉じる">×</button>
      </div>
      <div class="modal-form">
        <input id="goal-title-input" type="text" placeholder="例）英語をペラペラ話せる自分" maxlength="60">
        <textarea id="goal-note-input" class="modal-note-input" placeholder="なぜなりたいのか（任意）" rows="3"></textarea>
        <button id="btn-save-goal" class="btn-primary">追加する</button>
      </div>
    </div>
  </div>

</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
